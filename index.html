    "title": "CRM Channel API",
    "description": "Experience API that fronts internal CRM microservices (contact-information-xp, mm-otp-xp, customer-score-svc, systems-operations-journal) behind a single, typed, consistently-enveloped contract.\n\n## Authentication\n\nThe API is fronted by the external gateway, which requires an OAuth2 access\ntoken obtained with the **client credentials** flow from AWS Cognito.\nCredentials are issued per consumer \u2014 request them from the platform team.\n\n```sh\ncurl -X POST https://mm-dev-auth.auth.us-west-1.amazoncognito.com/oauth2/token \\\n  -H \"Content-Type: application/x-www-form-urlencoded\" \\\n  -d \"grant_type=client_credentials\" \\\n  -d \"client_id=<CLIENT_ID>\" \\\n  -d \"client_secret=<CLIENT_SECRET>\" \\\n  -d \"scope=https://api.dev.multimoney.tech/read\"\n```\n\nSend the returned `access_token` on every request:\n\n```\nAuthorization: Bearer <access_token>\n```\n\nTokens expire (`expires_in`, seconds); request a new one when they do.\n",
    "version": "0.1.1"
  },
